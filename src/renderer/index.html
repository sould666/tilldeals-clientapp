<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TillDeals Hardware</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header class="topbar">
        <div>
          <p class="eyebrow">LOCAL SYSTEM OVERVIEW</p>
          <h1>Machine profile</h1>
          <p id="updated-at" class="updated">Reading hardware details...</p>
        </div>
        <div class="top-actions">
          <button id="refresh" type="button">Refresh</button>
          <nav aria-label="Application views">
            <button class="nav-button active" data-nav="profile" type="button">Profile</button>
            <button class="nav-button" data-nav="settings" type="button">Settings</button>
            <button class="nav-button" data-nav="diagnosis" type="button">Manual Diagnosis</button>
          </nav>
        </div>
      </header>
      <section data-view="profile">
        <section id="summary" class="summary" aria-label="System summary"></section>
        <section id="details" class="details" aria-live="polite"></section>
      </section>
      <section class="utility-view" data-view="settings" hidden>
        <h2>Settings</h2>
        <label class="setting-row"><input id="auto-refresh" type="checkbox" /> Refresh hardware data every 60 seconds</label>
        <p class="utility-note">Hardware data is read locally. Nothing is uploaded by this application.</p>
      </section>
      <section class="utility-view" data-view="diagnosis" hidden>
        <div class="utility-heading"><div><p class="eyebrow">TROUBLESHOOTING</p><h2>Manual Diagnosis</h2></div><button id="back-to-profile" type="button">Back to profile</button></div>
        <div id="diagnosis-flow" class="diagnosis-flow"></div>
        <div id="diagnosis-results" class="diagnosis-results"></div>
      </section>
    </main>
    <template id="section-template">
      <article class="section">
        <h2></h2>
        <dl></dl>
      </article>
    </template>
    <script src="diagnosis-tree.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
