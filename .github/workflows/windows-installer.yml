name: Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test desktop contracts and updater
        run: |
          npm run test:backend
          npm run test:updates

      - name: Select immutable versioned release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = require('./package.json').version;
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Release requires a stable version.');
          console.log(`Current package version: ${version}`);
          const tag = `v${version}`;
          fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/releases/tags/${tag}`, {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
          }).then(async (response) => {
            if (response.status !== 200 && response.status !== 404) throw new Error(`Release lookup failed: ${response.status}`);
            const publish = response.status === 404;
            if (!publish) {
              const release = await response.json();
              if (release.draft || release.prerelease) throw new Error('Existing version is not a completed stable release; resolve it manually.');
              console.log(`${tag} is already published; bump package.json to publish a new update.`);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=${tag}\npublish=${publish}\n`);
          }).catch((error) => { console.error(error.message); process.exitCode = 1; });
          NODE

      - name: Build NSIS installer
        if: steps.release.outputs.publish == 'true'
        run: npm run package:installer

      - name: Checksum
        if: steps.release.outputs.publish == 'true'
        id: checksum
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist -Filter '*-Setup-*.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one versioned installer.' }
          $installer = $installers[0]
          $version = '${{ steps.release.outputs.version }}'
          if ($installer.Name -ne "TillDeals-Hardware-Setup-$version-win-x64.exe") { throw 'Unexpected installer filename.' }
          if (!(Test-Path 'dist/latest.yml') -or !(Test-Path "$($installer.FullName).blockmap")) { throw 'Missing updater metadata or blockmap.' }
          $metadata = Get-Content 'dist/latest.yml' -Raw
          if ($metadata -notmatch "(?m)^version: $([regex]::Escape($version))\r?$") { throw 'Updater metadata version mismatch.' }
          if ($metadata -notmatch "(?m)^path: $([regex]::Escape($installer.Name))\r?$") { throw 'Updater metadata installer filename mismatch.' }
          $sha512 = [Convert]::ToBase64String([Security.Cryptography.SHA512]::HashData([IO.File]::ReadAllBytes($installer.FullName)))
          if (!$metadata.Contains($sha512)) { throw 'Updater SHA-512 does not match installer.' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Out-File -Encoding ascii "dist/$($installer.Name).sha256"
          $latestInstaller = Join-Path $installer.DirectoryName 'TillDeals-Hardware-Setup-latest-win-x64.exe'
          Copy-Item $installer.FullName $latestInstaller
          $latestHash = (Get-FileHash $latestInstaller -Algorithm SHA256).Hash.ToLower()
          "$latestHash  $([System.IO.Path]::GetFileName($latestInstaller))" | Out-File -Encoding ascii "$latestInstaller.sha256"
          "installer=dist/$($installer.Name)" >> $env:GITHUB_OUTPUT
          "latestInstaller=dist/$([System.IO.Path]::GetFileName($latestInstaller))" >> $env:GITHUB_OUTPUT
          "name=$($installer.Name)" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.publish == 'true'
        with:
          name: tilldeals-windows-installer
          path: |
            ${{ steps.checksum.outputs.installer }}
            ${{ steps.checksum.outputs.installer }}.sha256
            ${{ steps.checksum.outputs.latestInstaller }}
            ${{ steps.checksum.outputs.latestInstaller }}.sha256
            ${{ steps.checksum.outputs.installer }}.blockmap
            dist/latest.yml

      - name: Publish versioned stable release
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            "${{ steps.checksum.outputs.installer }}" \
            "${{ steps.checksum.outputs.installer }}.sha256" \
            "${{ steps.checksum.outputs.latestInstaller }}" \
            "${{ steps.checksum.outputs.latestInstaller }}.sha256" \
            "${{ steps.checksum.outputs.installer }}.blockmap" \
            "dist/latest.yml" \
            --target "${{ github.sha }}" \
            --latest \
            --title "TillDeals Hardware ${{ steps.release.outputs.version }}" \
            --notes "Built from ${{ github.sha }}. SHA-256: ${{ steps.checksum.outputs.sha256 }}"

      - name: Verify published artifact and checksum
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download '${{ steps.release.outputs.tag }}' --dir dist/published-verification --pattern '${{ steps.checksum.outputs.name }}' --pattern '${{ steps.checksum.outputs.name }}.sha256' --pattern 'latest.yml'
          if ($LASTEXITCODE -ne 0) { throw 'Published artifact download failed.' }
          $installer = Join-Path 'dist/published-verification' '${{ steps.checksum.outputs.name }}'
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          $checksum = (Get-Content "$installer.sha256" -Raw).Trim()
          if ($hash -ne '${{ steps.checksum.outputs.sha256 }}' -or $checksum -ne "$hash  ${{ steps.checksum.outputs.name }}") { throw 'Published artifact checksum mismatch.' }
          $metadataHash = (Get-FileHash 'dist/latest.yml' -Algorithm SHA256).Hash
          if ((Get-FileHash 'dist/published-verification/latest.yml' -Algorithm SHA256).Hash -ne $metadataHash) { throw 'Published metadata mismatch.' }
          Write-Host "Verified $installer SHA-256: $hash"
